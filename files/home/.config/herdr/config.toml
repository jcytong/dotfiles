onboarding = false
# herdr configuration — staged migration from ~/.tmux.conf
#
# STAGE 1 is active. Stages 2–4 are parked below as comments.
# Uncomment ONE stage at a time, then:
#
#   herdr config check          # validate (catches typos + invalid bindings)
#   herdr server reload-config  # apply without restarting the server
#
# Panic button — backs up this file and strips all custom keybindings:
#   herdr config reset-keys

# ─────────────────────────────────────────────────────────────────────
# STAGE 1 — the chords your fingers already know          [ACTIVE]
# Only the keys where tmux and herdr disagree. Zero tradeoffs.
# ─────────────────────────────────────────────────────────────────────
[keys]
prefix = "ctrl+a"                            # tmux: set -g prefix C-a  (was ctrl+b)

split_vertical   = "prefix+shift+backslash"  # tmux: bind | split-window -h  → side by side
split_horizontal = "prefix+minus"            # tmux: bind - split-window -v  → stacked

reload_config = "prefix+r"                   # tmux: bind r source-file
resize_mode   = "prefix+shift+r"             # swapped with reload_config to free prefix+r

detach = "prefix+d"                          # tmux: prefix d  (herdr default was prefix+q)

toggle_sidebar = "prefix+\\"              # the agent panel; herdr default prefix+b is now free

# Bare-chord pane movement is Stage 3 and no longer lives here: ctrl+hjkl now
# goes through [[keys.command]] at the bottom so it can test for vim first.
# focus_pane_left/down/up/right keep their herdr defaults of prefix+h/j/k/l,
# which stay unconditional — the escape hatch if the vim test ever misfires.

# Already identical to your tmux — no config needed:
#   prefix+c  new tab        (tmux: new-window)
#   prefix+n  next tab       prefix+p  previous tab
#   prefix+1..9  switch tab  (tmux base-index 1 — herdr already 1-indexed)
#   prefix+z  zoom           prefix+x  close pane
#   prefix+tab  cycle pane   (tmux: bind ^J select-pane -t :.+)

# ─────────────────────────────────────────────────────────────────────
# STAGE 2 — make it look like home                     [PART ACTIVE]
# Cosmetic only. Nothing here can break a keybinding.
# ─────────────────────────────────────────────────────────────────────
# theme.name          -> you chose "tokyo-night" (see [theme] at the bottom)
# ui.accent           -> ACTIVE, see [ui] at the bottom
# advanced.scrollback -> ACTIVE, see [advanced] at the bottom
#
# Still parked — uncomment into the [ui] table at the bottom when you want them:
# pane_borders = true      # tmux: pane-border-style
# copy_on_select = false   # your tmux copy-mode requires an explicit y (keeps that habit)

# ─────────────────────────────────────────────────────────────────────
# STAGE 3 — where herdr and tmux genuinely diverge        [ACTIVE]
# The bindings are the four [[keys.command]] blocks at the bottom. This is the
# note explaining why they are commands rather than plain focus_pane_* keys.
#
# Your tmux does vim-AWARE pane switching: C-hjkl checks whether the pane is
# running vim (is_vim) and forwards the key instead of switching panes.
# herdr has no is_vim equivalent and cannot conditionally pass keys through —
# so the condition moved out of the config and into a script.
# ~/.config/herdr/vim-aware-focus asks `herdr pane process-info` what is in the
# focused pane's foreground, then either `pane send-keys` (vim) or `pane focus`
# (anything else). That is tmux's if-shell, spelled with the socket API.
#
# The return trip is ~/.vimrc: at the edge of vim's own splits vim calls
# `herdr pane focus` and focus leaves vim for the neighbouring herdr pane.
# The pair is what vim-tmux-navigator + is_vim give you under tmux — and the
# vim half is new, because .vimrc's own <C-w> maps used to shadow the plugin.
#
# Still safe to bind while tmux is parked: your tmux bound C-hjkl in the ROOT
# table (bind-key -n), so a running tmux would intercept these before herdr.
# If you ever un-park tmux, comment the four [[keys.command]] blocks out or the
# two will fight. Nothing else to undo — .vimrc dispatches on $TMUX and hands
# tmux sessions to vim-tmux-navigator untouched.
#
# last_pane = "prefix+ctrl+a"   # tmux: bind C-\ select-pane -l (back-and-forth)

# ─────────────────────────────────────────────────────────────────────
# STAGE 4 — things tmux never had                         [PARKED]
# New muscle memory. Save for when Stages 1–3 feel automatic.
# ─────────────────────────────────────────────────────────────────────
# [session]
# resume_agents_on_restore = true   # replaces tmux-resurrect, but for agent sessions
#
# [ui.toast]
# delivery = "herdr"       # agent finished / needs input, without watching the pane
# delay_seconds = 1
#
# [ui.sound]
# enabled = true
#
# [worktrees]
# directory = "~/.herdr/worktrees"
#
# [keys] additions for agent work — herdr has no tmux analogue for these:
#   prefix+w        workspace picker
#   prefix+g        goto / navigate mode
#   prefix+/        toggle sidebar (the agent panel) — rebound in [keys] above
#   prefix+shift+g  new worktree
#   prefix+e        edit scrollback in $EDITOR

# ─────────────────────────────────────────────────────────────────────
# PREFIX+SPACE — the tmux chord herdr has no action for   [ACTIVE]
# tmux: prefix Space = next-layout. herdr ships no layout action at all,
# so this goes through [[keys.command]] and the session socket instead.
#
# What you get: every split in the focused tab is resized so all panes end
# up the same area. Non-destructive — pane IDs, processes, and scrollback
# are untouched. Press it again and nothing moves; it is idempotent.
#
# What you do NOT get: tmux cycles the layout *shape* (even-horizontal →
# even-vertical → main-vertical → tiled). herdr's layout.apply tears the
# tab down and respawns fresh panes, and pane move is a no-op within a tab,
# so reshaping cannot be done without killing what is running. Only the
# even-out half of next-layout is safe, and that is what this binds.
# ─────────────────────────────────────────────────────────────────────
[[keys.command]]
key = "prefix+space"
type = "shell"
command = "$HOME/.config/herdr/balance-layout"

# ─────────────────────────────────────────────────────────────────────
# PREFIX+CTRL+O — tmux's rotate-window                       [ACTIVE]
# tmux: prefix C-o = rotate-window, prefix M-o = rotate-window -D. herdr
# has no rotate action either, so this is another [[keys.command]].
#
# What you get: every pane slides one position through the tab's existing
# cells, upward, the direction tmux's C-o rotates. Panes keep their IDs,
# processes, and scrollback — only who sits where changes. The script
# takes --down for tmux's M-o direction if you ever want it on a key too.
#
# Why rotating is safe where reshaping (see prefix+space) is not: this
# moves occupants between cells with pane.swap and never touches the tree.
# Restructuring is the part herdr refuses — pane.move inside one tab
# answers same_tab, and layout.apply respawns the panes into a new tab.
# ─────────────────────────────────────────────────────────────────────
[[keys.command]]
key = "prefix+ctrl+o"
type = "shell"
command = "$HOME/.config/herdr/rotate-layout"

# ─────────────────────────────────────────────────────────────────────
# CTRL+H/J/K/L — vim-aware pane movement                     [ACTIVE]
# tmux: bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
#
# herdr's focus_pane_* actions are unconditional: bound to ctrl+hjkl they eat
# the chord before vim ever sees it, which is exactly what made these keys stop
# working inside a vim split. [[keys.command]] is the way back, because a shell
# command can look at the pane before deciding what the key means.
#
# ~/.config/herdr/vim-aware-focus makes that decision: vim in the pane's
# foreground gets the chord forwarded verbatim, anything else moves focus.
# type = "shell" runs it detached, so nothing flashes on screen.
#
# prefix+h/j/k/l still move panes unconditionally, including out of a vim that
# has grabbed the chord. See the Stage 3 note above for the whole round trip.
# ─────────────────────────────────────────────────────────────────────
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "$HOME/.config/herdr/vim-aware-focus left"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "$HOME/.config/herdr/vim-aware-focus down"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "$HOME/.config/herdr/vim-aware-focus up"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "$HOME/.config/herdr/vim-aware-focus right"

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
# Was green to match tmux's pane-active-border-style fg=#00ff00; swapped to
# tokyo-night's native accent so the active-pane border matches the theme.
accent = "#7aa2f7"
# false killed every click in herdr; Shift+drag still selects natively
mouse_capture = true
agent_panel_sort = "spaces"

[advanced]
# tmux: history-limit 100000 (lines). herdr caps by BYTES, not lines, so this
# is an approximation: 50 MB ≈ 100k lines of ordinary terminal output, and
# well past it for sparse output. Default was 10 MB.
scrollback_limit_bytes = 50000000
